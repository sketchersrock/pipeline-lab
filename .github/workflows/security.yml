name: security
on: [push, pull_request]

jobs:
  secrets:
    name: Secret scan (Gitleaks) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # gitleaks needs history
      - name: Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --exit-code 1 -v

  sast:
    name: SAST (Semgrep) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.186.0 \
            semgrep scan --config auto --error /src

  deps:
    name: Dependency scan (Trivy) - REPORT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:0.76.2 \
            fs --scanners vuln --exit-code 0 /repo
