name: security
on: [push, pull_request]

# Least privilege: the GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # gitleaks needs history
          persist-credentials: false  # don't leave the token in .git/config
      - name: Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --exit-code 1 -v

  sast:
    name: SAST (Semgrep) - GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.186.0 \
            semgrep scan --config auto --error /src

  deps:
    name: Dependency scan (Trivy) - REPORT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:0.76.2 \
            fs --scanners vuln --exit-code 0 /repo
